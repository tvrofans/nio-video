events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    server {
        listen 80;
        server_name localhost;

        # 开启代码注入
        sub_filter_once off;
        sub_filter_types text/html;

        location / {
            # 转发给 Python Flask 容器
            proxy_pass http://app:5000;
            
            # 禁止压缩以允许注入
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # --- 蔚来行车破解注入 ---
            # 注入 Canvas 脚本
            sub_filter '</body>' '<script src="/canvas.js?v=nio"></script></body>';
            # 注入 PWA 伪装
            sub_filter '<head>' '<head><link rel="manifest" href="/manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">';
        }

        # 静态文件映射
        location /canvas.js { alias /usr/share/nginx/html/canvas.js; }
        location /manifest.json { alias /usr/share/nginx/html/manifest.json; add_header Content-Type application/json; }
    }
}